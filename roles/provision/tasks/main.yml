---
# OS X config
- block:
    - name: disable natural scrolling
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.swipescrolldirection
        type: bool
        value: false
        state: present
      tags: 'osx'

  rescue:
    - name: scrolling value not available
      debug:
        msg: "There was an error accessing com.apple.swipescrolldirection on macOS {{ ansible_distribution_version }}"

- block:
    - name: disable autocorrect
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSAutomaticSpellingCorrectionEnabled
        type: bool
        value: false
        state: present
      tags: 'osx'

  rescue:
    - name: autocorrect value not available
      debug:
        msg: "There was an error accessing NSAutomaticSpellingCorrectionEnabled on macOS {{ ansible_distribution_version }}"

- block:
    - name: set dock size
      community.general.osx_defaults:
        domain: com.apple.dock
        key: tilesize
        type: float
        value: 37
        state: present
      tags: 'dock'

  rescue:
    - name: Dock size value not available
      debug:
        msg: "There was an error accessing com.apple.dock on macOS {{ ansible_distribution_version }}"

- block:
    - name: Set dock recent
      community.general.osx_defaults:
        domain: com.apple.dock
        key: show-recents
        type: bool
        value: false
        state: present
      tags: 'dock'

  rescue:
    - name: dock recents value not available
      debug:
        msg: "There was an error accessing com.apple.dock on macOS {{ ansible_distribution_version }}"

- block:
    - name: show battery percentage in Control Center
      community.general.osx_defaults:
        domain: com.apple.controlcenter
        host: currentHost
        key: BatteryShowPercentage
        type: bool
        value: true
        state: present
      tags: 'menu'

    - name: show Bluetooth in menu bar
      community.general.osx_defaults:
        domain: com.apple.controlcenter
        host: currentHost
        key: Bluetooth
        type: int
        value: 18
        state: present
      tags: 'menu'

    - name: show Wi-Fi in menu bar
      community.general.osx_defaults:
        domain: com.apple.controlcenter
        host: currentHost
        key: WiFi
        type: int
        value: 18
        state: present
      tags: 'menu'

  rescue:
    - name: Control Center settings not available
      debug:
        msg: "Error setting com.apple.controlcenter on macOS {{ ansible_distribution_version }}"

- block:
    - name: set column view in finder
      community.general.osx_defaults:
        domain: com.apple.Finder
        key: FXPreferredViewStyle
        type: string
        value: Nlsv
        state: present
      tags: 'finder'

  rescue:
    - name: finder view value not available
      debug:
        msg: "There was an error accessing com.apple.Finder on macOS {{ ansible_distribution_version }}"

- block:
    - name: set NewWindowTarget in finder
      community.general.osx_defaults:
        domain: com.apple.Finder
        key: NewWindowTarget
        type: string
        value: PfLo
        state: present
      tags: 'finder'

  rescue:
    - name: finder NewWindowTarget value not available
      debug:
        msg: "There was an error accessing com.apple.Finder on macOS {{ ansible_distribution_version }}"

- block:
    - name: turn off time machine for new disks
      community.general.osx_defaults:
        domain: com.apple.TimeMachine
        key: DoNotOfferNewDisksForBackup
        type: bool
        value: true
        state: present
      tags: 'timemachine'

  rescue:
    - name: com.apple.TimeMachine value not available
      debug:
        msg: "there was an error accessing com.apple.Finder on macOS {{ ansible_distribution_version }}"
